# Per-event title/body labels for notifications fanned out from the Comptroller
# via `message_notify` P2P events. These let the user-facing strings stay in
# the user's locale via mochi.app.label(). ICU MessageFormat is used for
# variable substitution. Counterpart notify(...) calls live in the Comptroller
# (apps/comptroller/starlark/) — this is the catalog the market app exposes so
# the Comptroller can later switch from literal English to label keys without
# duplicating strings.

