notifications.subscription.chargeback.body = ਖਰੀਦਦਾਰ ਦੇ ਬੈਂਕ ਨੇ {listing} ਉੱਤੇ ਚਾਰਜਬੈਕ ਦਾਇਰ ਕੀਤਾ। ਸਬਸਕ੍ਰਿਪਸ਼ਨ ਰੱਦ ਕੀਤੀ ਗਈ। Stripe Dashboard ਉੱਤੇ ਸਬੂਤ ਜਮ੍ਹਾਂ ਕਰੋ।
notifications.subscription.chargeback_won.body = Stripe ਨੇ {listing} ਉੱਤੇ ਤੁਹਾਡੇ ਹੱਕ ਵਿੱਚ ਫੈਸਲਾ ਦਿੱਤਾ। ਰਕਮ ਵਾਪਸ ਕਰ ਦਿੱਤੀ ਗਈ।
notifications.subscription.chargeback_lost.body = Stripe ਨੇ {listing} ਉੱਤੇ ਖਰੀਦਦਾਰ ਦੇ ਹੱਕ ਵਿੱਚ ਫੈਸਲਾ ਦਿੱਤਾ। ਰਕਮ ਡੈਬਿਟ ਕਰ ਦਿੱਤੀ ਗਈ।

