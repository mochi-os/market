notifications.account.stripe_restricted.body = Stripe ਨੇ ਤੁਹਾਡੇ ਖਾਤੇ ਉੱਤੇ ਪਾਬੰਦੀ ਲਗਾ ਦਿੱਤੀ ਹੈ। ਵੇਚਣਾ ਮੁੜ ਸ਼ੁਰੂ ਕਰਨ ਲਈ Stripe Dashboard ਉੱਤੇ ਹੱਲ ਕਰੋ।
notifications.account.stripe_disconnected.body = ਤੁਸੀਂ Mochi ਦੀ Stripe ਪਹੁੰਚ ਰੱਦ ਕਰ ਦਿੱਤੀ। ਮੁੜ ਭੁਗਤਾਨ ਸਵੀਕਾਰ ਕਰਨ ਲਈ ਦੁਬਾਰਾ ਕਨੈਕਟ ਕਰੋ।
notifications.account.suspended.body = ਤੁਹਾਡੇ ਵੇਚਣ ਵਾਲੇ ਦੇ ਅਧਿਕਾਰ ਮੁਅੱਤਲ ਕਰ ਦਿੱਤੇ ਗਏ ਹਨ। ਤੁਸੀਂ ਫਿਰ ਵੀ ਖਰੀਦ ਸਕਦੇ ਹੋ।
notifications.account.unsuspended.title = ਵੇਚਣ ਵਾਲੇ ਦੇ ਅਧਿਕਾਰ ਬਹਾਲ ਕੀਤੇ ਗਏ
notifications.account.unsuspended.body = ਤੁਹਾਡੇ ਵੇਚਣ ਵਾਲੇ ਦੇ ਅਧਿਕਾਰ ਬਹਾਲ ਕਰ ਦਿੱਤੇ ਗਏ ਹਨ।
notifications.account.banned.body = ਤੁਹਾਡੇ ਖਾਤੇ ਉੱਤੇ ਪਾਬੰਦੀ ਲਗਾ ਦਿੱਤੀ ਗਈ ਹੈ। ਤੁਸੀਂ ਖਰੀਦ ਜਾਂ ਵੇਚ ਨਹੀਂ ਸਕਦੇ।
notifications.account.unbanned.title = ਖਾਤਾ ਬਹਾਲ ਕੀਤਾ ਗਿਆ
