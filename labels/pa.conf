notifications.account.stripe_disconnected.body = ਤੁਸੀਂ Mochi ਦੀ Stripe ਪਹੁੰਚ ਰੱਦ ਕਰ ਦਿੱਤੀ। ਮੁੜ ਭੁਗਤਾਨ ਸਵੀਕਾਰ ਕਰਨ ਲਈ ਦੁਬਾਰਾ ਕਨੈਕਟ ਕਰੋ।
notifications.account.stripe_reconnect_required.title = ਆਪਣਾ ਭੁਗਤਾਨ ਖਾਤਾ ਮੁੜ ਜੋੜੋ
