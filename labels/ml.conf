notifications.account.stripe_disconnected.body = Mochi-യുടെ Stripe പ്രവേശനം നിങ്ങൾ പിൻവലിച്ചു. വീണ്ടും പേയ്മെന്റുകൾ സ്വീകരിക്കാൻ വീണ്ടും കണക്റ്റ് ചെയ്യുക.
notifications.account.suspended.body = നിങ്ങളുടെ വിൽപ്പനക്കാരന്റെ പ്രത്യേകാവകാശങ്ങൾ സസ്പെൻഡ് ചെയ്തു. നിങ്ങൾക്ക് ഇപ്പോഴും വാങ്ങാം.
notifications.account.unsuspended.title = വിൽപ്പനക്കാരന്റെ പ്രത്യേകാവകാശങ്ങൾ പുനഃസ്ഥാപിച്ചു
notifications.account.unsuspended.body = നിങ്ങളുടെ വിൽപ്പനക്കാരന്റെ പ്രത്യേകാവകാശങ്ങൾ പുനഃസ്ഥാപിച്ചു.
notifications.account.banned.body = നിങ്ങളുടെ അക്കൗണ്ട് നിരോധിച്ചു. നിങ്ങൾക്ക് വാങ്ങാനോ വിൽക്കാനോ കഴിയില്ല.
notifications.account.unbanned.title = അക്കൗണ്ട് പുനഃസ്ഥാപിച്ചു
notifications.account.unbanned.body = നിങ്ങളുടെ അക്കൗണ്ട് നിരോധനം നീക്കി.
notifications.report.dismissed.title = റിപ്പോർട്ട് തള്ളിക്കളഞ്ഞു
notifications.report.dismissed.body = നടപടിയൊന്നും സ്വീകരിച്ചില്ല
notifications.report.dismissed_notes.body = നടപടിയൊന്നും സ്വീകരിച്ചില്ല: {notes}
notifications.report.actioned_warn_seller_notes.body = വിൽപ്പനക്കാരന് മുന്നറിയിപ്പ് നൽകി: {notes}
notifications.report.actioned_warn_user.body = ഉപയോക്താവിന് മുന്നറിയിപ്പ് നൽകി
notifications.report.actioned_warn_user_notes.body = ഉപയോക്താവിന് മുന്നറിയിപ്പ് നൽകി: {notes}
notifications.report.actioned_remove_notes.body = ലിസ്റ്റിംഗ് നീക്കം ചെയ്തു: {notes}
notifications.report.actioned_suspend_notes.body = വിൽപ്പനക്കാരനെന്ന നിലയിൽ സസ്പെൻഡ് ചെയ്തു: {notes}
notifications.report.actioned_ban_notes.body = അക്കൗണ്ട് നിരോധിച്ചു: {notes}
notifications.report.target_warned.title = മുന്നറിയിപ്പ് ലഭിച്ചു
notifications.subscription.chargeback.body = {listing}-ൽ വാങ്ങുന്നയാളുടെ ബാങ്ക് ഒരു ചാർജ്ബാക്ക് ഫയൽ ചെയ്തു. സബ്സ്ക്രിപ്ഷൻ റദ്ദാക്കി. Stripe Dashboard-ൽ തെളിവ് സമർപ്പിക്കുക.
notifications.subscription.chargeback_won.body = {listing}-ൽ Stripe നിങ്ങൾക്ക് അനുകൂലമായി വിധിച്ചു. തുക തിരികെ നൽകി.
notifications.subscription.chargeback_lost.body = {listing}-ൽ Stripe വാങ്ങുന്നയാൾക്ക് അനുകൂലമായി വിധിച്ചു. തുക ഈടാക്കി.
