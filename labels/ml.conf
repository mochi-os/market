notifications.account.stripe_disconnected.body = Mochi-യുടെ Stripe പ്രവേശനം നിങ്ങൾ പിൻവലിച്ചു. വീണ്ടും പേയ്മെന്റുകൾ സ്വീകരിക്കാൻ വീണ്ടും കണക്റ്റ് ചെയ്യുക.
notifications.account.stripe_reconnect_required.title = നിങ്ങളുടെ പേയ്‌മെന്റ് അക്കൗണ്ട് വീണ്ടും കണക്റ്റ് ചെയ്യുക
notifications.account.stripe_reconnect_required.body = Mochi-ന് ഇനി നിങ്ങളുടെ Stripe അക്കൗണ്ടിലേക്ക് എത്താനാകില്ല. പേയ്‌മെന്റുകൾ സ്വീകരിക്കുന്നത് തുടരാൻ അത് വീണ്ടും കണക്റ്റ് ചെയ്യുക.
notifications.account.suspended.body = നിങ്ങളുടെ വിൽപ്പനക്കാരന്റെ പ്രത്യേകാവകാശങ്ങൾ സസ്പെൻഡ് ചെയ്തു. നിങ്ങൾക്ക് ഇപ്പോഴും വാങ്ങാം.
notifications.account.unsuspended.title = വിൽപ്പനക്കാരന്റെ പ്രത്യേകാവകാശങ്ങൾ പുനഃസ്ഥാപിച്ചു
