notifications.account.suspended.body = உங்கள் விற்பனையாளர் சலுகைகள் இடைநிறுத்தப்பட்டன. நீங்கள் இன்னும் வாங்கலாம்.
notifications.account.unsuspended.title = விற்பனையாளர் சலுகைகள் மீட்டமைக்கப்பட்டன
notifications.account.unsuspended.body = உங்கள் விற்பனையாளர் சலுகைகள் மீட்டமைக்கப்பட்டன.
notifications.account.banned.body = உங்கள் கணக்கு தடைசெய்யப்பட்டது. நீங்கள் வாங்கவோ விற்கவோ முடியாது.
notifications.account.unbanned.title = கணக்கு மீட்டமைக்கப்பட்டது
notifications.account.unbanned.body = உங்கள் கணக்குத் தடை நீக்கப்பட்டது.
notifications.report.dismissed.title = புகார் நிராகரிக்கப்பட்டது
notifications.report.dismissed.body = எந்த நடவடிக்கையும் எடுக்கப்படவில்லை
notifications.report.dismissed_notes.body = எந்த நடவடிக்கையும் எடுக்கப்படவில்லை: {notes}
notifications.report.actioned_warn_seller_notes.body = விற்பனையாளர் எச்சரிக்கப்பட்டார்: {notes}
notifications.report.actioned_warn_user.body = பயனர் எச்சரிக்கப்பட்டார்
notifications.report.actioned_warn_user_notes.body = பயனர் எச்சரிக்கப்பட்டார்: {notes}
notifications.report.actioned_remove_notes.body = பட்டியல் நீக்கப்பட்டது: {notes}
notifications.report.actioned_suspend_notes.body = விற்பனையாளராக இடைநிறுத்தப்பட்டது: {notes}
notifications.report.actioned_ban_notes.body = கணக்கு தடைசெய்யப்பட்டது: {notes}
notifications.report.target_warned.title = எச்சரிக்கை பெறப்பட்டது
notifications.subscription.chargeback.body = {listing}-இல் வாங்குபவரின் வங்கி சார்ஜ்பேக் தாக்கல் செய்தது. சந்தா ரத்துசெய்யப்பட்டது. Stripe Dashboard-இல் சான்றுகளைச் சமர்ப்பிக்கவும்.
notifications.subscription.chargeback_won.body = {listing}-இல் Stripe உங்களுக்கு சாதகமாக தீர்ப்பளித்தது. நிதி திருப்பித் தரப்பட்டது.
notifications.subscription.chargeback_lost.body = {listing}-இல் Stripe வாங்குபவருக்கு சாதகமாக தீர்ப்பளித்தது. நிதி பற்று வைக்கப்பட்டது.
